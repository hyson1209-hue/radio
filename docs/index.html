<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBC충북 라디오</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MBC충북">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #program-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58vh;
      z-index: -1;
      background-size: cover;
      background-position: center top;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #program-bg.show { opacity: 1; }
    .player { transition: margin-top 1.5s ease; }
    body.has-program .player { margin-top: 38vh; }
    #onair-host {
      color: #e5e7eb;
      font-size: 0.9rem;
      margin: -12px 0 20px;
      min-height: 1.2em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    body {
      font-family: -apple-system, "Malgun Gothic", sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player {
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    .channels { display: flex; gap: 12px; margin-bottom: 32px; }
    .channel {
      flex: 1;
      padding: 16px 8px;
      border: 2px solid #374151;
      border-radius: 12px;
      background: transparent;
      color: #9ca3af;
      font-size: 1rem;
      cursor: pointer;
    }
    .channel.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }
    .channel small { display: block; margin-top: 4px; font-size: 0.75rem; }
    #play {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: none;
      background: #38bdf8;
      color: #111827;
      font-size: 2rem;
      cursor: pointer;
      margin-bottom: 24px;
    }
    #play:active { transform: scale(0.95); }
    #status { color: #9ca3af; font-size: 0.9rem; min-height: 1.2em; margin-bottom: 24px; }
    .volume { display: flex; align-items: center; gap: 12px; }
    .volume input { flex: 1; accent-color: #38bdf8; }
    #visible-radio-btn {
      margin-top: 28px;
      padding: 12px 20px;
      border: 2px solid #374151;
      border-radius: 12px;
      background: transparent;
      color: #9ca3af;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #visible-radio-btn.active {
      border-color: #f87171;
      color: #f87171;
    }
    #visible-radio { margin-top: 20px; }
    #yt-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
      background: #000;
    }
    .yt-note { color: #6b7280; font-size: 0.8rem; margin-top: 8px; }
    .yt-note a { color: #38bdf8; }
    .freq { margin-top: 28px; color: #6b7280; font-size: 0.8rem; }
    .freq summary { cursor: pointer; list-style-position: inside; }
    .freq summary:hover { color: #9ca3af; }
    .freq p { margin-top: 10px; line-height: 1.6; }
    .freq strong { color: #9ca3af; font-weight: 600; }
  </style>
</head>
<body>
  <div id="program-bg"></div>
  <div class="player">
    <h1>MBC충북 라디오</h1>
    <p id="onair-host"></p>
    <div class="channels">
      <button class="channel" data-channel="fm1">제1FM<small>표준FM 107.1MHz</small></button>
      <button class="channel active" data-channel="fm2">제2FM<small>FM4U 99.7MHz</small></button>
    </div>
    <button id="play" aria-label="재생">&#9654;</button>
    <p id="status">채널을 선택하고 재생을 누르세요</p>
    <div class="volume">
      <span aria-hidden="true">&#128266;</span>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="볼륨">
    </div>
    <button id="visible-radio-btn">&#128250; 보이는 라디오</button>
    <div id="visible-radio" hidden>
      <iframe id="yt-frame" title="보이는 라디오" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      <p class="yt-note">방송 중이 아니면 재생되지 않을 수 있습니다.
        <a href="https://www.youtube.com/channel/UCKvnHmqJvQQ9osEO1qRz9nA/live" target="_blank" rel="noopener">유튜브에서 열기</a></p>
    </div>
    <details class="freq">
      <summary>지역별 주파수 안내</summary>
      <p><strong>제1FM</strong> 청주 107.1 &middot; 충주 96.1 &middot; 제천 94.7 &middot; 보은/옥천/영동 96.3 &middot; 단양 94.1<br>
      <strong>제2FM</strong> 청주 99.7 &middot; 충주 88.7</p>
    </details>
    <audio id="audio"></audio>
  </div>

  <script>
    const STREAMS = {
      fm1: { name: 'MBC충북 표준FM', url: 'https://mbccbp.coreit.co.kr/radio_stfm/myStream.sdp/playlist.m3u8' },
      fm2: { name: 'MBC충북 FM4U', url: 'https://mbccbp.coreit.co.kr/radio_fm/myStream.sdp/playlist.m3u8' }
    };

    // 월~금 편성, start/end는 분 단위 (KST)
    const SCHEDULE = {
      fm1: [
        { start: 11 * 60 + 5, end: 11 * 60 + 57, name: '시사ON, 여기는 MBC충북입니다!', time: '월~금 11:05~11:57', img: 'img/sisa-on.jpg' }
      ],
      fm2: [
        { start: 12 * 60, end: 14 * 60, name: '정오의 희망곡', time: '월~금 12:00~14:00', img: 'img/jeongo-hope.jpg' },
        { start: 16 * 60, end: 18 * 60, name: '완벽한 하루', time: '월~금 16:00~18:00', img: 'img/perfect-day.jpg' }
      ]
    };

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const status = document.getElementById('status');
    let currentChannel = 'fm2';
    let hls = null;
    let playing = false;

    function loadStream(channel) {
      const stream = STREAMS[channel];
      if (hls) { hls.destroy(); hls = null; }
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(stream.url);
        hls.attachMedia(audio);
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = stream.url;
      } else {
        status.textContent = '이 브라우저에서는 재생할 수 없습니다';
        return false;
      }
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: stream.name, artist: 'MBC충북 라디오'
        });
      }
      return true;
    }

    function play() {
      closeVisibleRadio();
      if (!loadStream(currentChannel)) return;
      status.textContent = '연결 중...';
      audio.play().then(() => {
        playing = true;
        playBtn.innerHTML = '&#10074;&#10074;';
        playBtn.setAttribute('aria-label', '정지');
        status.textContent = STREAMS[currentChannel].name + ' 재생 중';
      }).catch(() => {
        status.textContent = '재생에 실패했습니다. 다시 시도해 주세요';
      });
    }

    function stop() {
      audio.pause();
      if (hls) { hls.destroy(); hls = null; }
      audio.removeAttribute('src');
      playing = false;
      playBtn.innerHTML = '&#9654;';
      playBtn.setAttribute('aria-label', '재생');
      status.textContent = '정지됨';
    }

    playBtn.addEventListener('click', () => playing ? stop() : play());

    document.querySelectorAll('.channel').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.channel.active').classList.remove('active');
        btn.classList.add('active');
        currentChannel = btn.dataset.channel;
        updateProgram();
        if (playing) play();
      });
    });

    document.getElementById('volume').addEventListener('input', e => {
      audio.volume = e.target.value;
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', play);
      navigator.mediaSession.setActionHandler('pause', stop);
    }

    const programBg = document.getElementById('program-bg');
    const onairHost = document.getElementById('onair-host');

    function kstNow() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false, timeZone: 'Asia/Seoul'
      }).formatToParts(new Date());
      const get = type => parts.find(p => p.type === type).value;
      const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
      return {
        day: days[get('weekday')],
        minutes: (parseInt(get('hour'), 10) % 24) * 60 + parseInt(get('minute'), 10)
      };
    }

    function updateProgram() {
      const now = kstNow();
      const isWeekday = now.day >= 1 && now.day <= 5;
      const slot = isWeekday &&
        SCHEDULE[currentChannel].find(s => now.minutes >= s.start && now.minutes < s.end);
      if (slot) {
        programBg.style.backgroundImage =
          'linear-gradient(to bottom, rgba(17,24,39,0.1) 0%, rgba(17,24,39,0.45) 55%, #111827 95%), url("' + slot.img + '")';
        programBg.classList.add('show');
        document.body.classList.add('has-program');
        onairHost.innerHTML = '&#128251; ' + slot.name + ' (' + slot.time + ')';
      } else {
        programBg.classList.remove('show');
        document.body.classList.remove('has-program');
        onairHost.textContent = '';
      }
    }

    updateProgram();
    setInterval(updateProgram, 60 * 1000);

    const visibleBtn = document.getElementById('visible-radio-btn');
    const visibleBox = document.getElementById('visible-radio');
    const ytFrame = document.getElementById('yt-frame');
    const YT_EMBED = 'https://www.youtube.com/embed/live_stream?channel=UCKvnHmqJvQQ9osEO1qRz9nA&autoplay=1';

    function closeVisibleRadio() {
      ytFrame.src = '';
      visibleBox.hidden = true;
      visibleBtn.classList.remove('active');
      visibleBtn.innerHTML = '&#128250; 보이는 라디오';
    }

    visibleBtn.addEventListener('click', () => {
      if (visibleBox.hidden) {
        if (playing) stop();
        ytFrame.src = YT_EMBED;
        visibleBox.hidden = false;
        visibleBtn.classList.add('active');
        visibleBtn.innerHTML = '&#10005; 보이는 라디오 닫기';
        visibleBox.scrollIntoView({ behavior: 'smooth', block: 'end' });
      } else {
        closeVisibleRadio();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      // 새 서비스 워커가 적용되면 한 번만 새로고침해서 최신 화면을 바로 반영
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
